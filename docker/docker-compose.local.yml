version: '3.8'

services:
  orchard-pipeline:
    image: orchard-pipeline:latest
    pull_policy: never  # Use local image, don't try to pull from registry
    container_name: orchard-pipeline
    volumes:
      # Absolute paths - work from any directory
      - /Users/matthewhooton/PycharmProjects/orchard/src:/opt/orchard/src
      - /Users/matthewhooton/data/SPECULOOSPipeline:/data/SPECULOOSPipeline
      - /Users/matthewhooton/PycharmProjects/orchard/results:/opt/orchard/results
    working_dir: /opt/orchard/src
    environment:
      - ORCHARD_PATH=/opt/orchard/src
      - PYTHONPATH=/opt/orchard/src
      - N_CORES=1
    command: bash
    stdin_open: true
    tty: true
    platform: linux/amd64
